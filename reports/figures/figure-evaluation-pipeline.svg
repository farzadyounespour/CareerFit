<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980" role="img" aria-labelledby="title desc">
  <title id="title">Evaluation pipeline</title>
  <desc id="desc">CareerFit evaluation pipeline from controlled resume-job cases and manually defined expected labels through keyword, TF-IDF, and hybrid semantic matching, then metrics and findings.</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .title { fill: #0f172a; font: 700 42px Arial, Helvetica, sans-serif; }
      .subtitle { fill: #475569; font: 400 21px Arial, Helvetica, sans-serif; }
      .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 18; }
      .box-input { fill: #eff6ff; stroke: #bfdbfe; stroke-width: 2; rx: 18; }
      .box-method { fill: #ecfdf5; stroke: #99f6e4; stroke-width: 2; rx: 18; }
      .box-metric { fill: #fffbeb; stroke: #fde68a; stroke-width: 2; rx: 18; }
      .box-final { fill: #f0fdfa; stroke: #5eead4; stroke-width: 2; rx: 18; }
      .step { fill: #64748b; font: 700 15px Arial, Helvetica, sans-serif; letter-spacing: .5px; }
      .label { fill: #0f172a; font: 700 25px Arial, Helvetica, sans-serif; }
      .small { fill: #475569; font: 400 18px Arial, Helvetica, sans-serif; }
      .note { fill: #0f766e; font: 700 18px Arial, Helvetica, sans-serif; }
      .pill { fill: #f1f5f9; stroke: #e2e8f0; stroke-width: 1.5; rx: 12; }
      .pill-text { fill: #334155; font: 700 15px Arial, Helvetica, sans-serif; }
      .arrow { stroke: #0f766e; stroke-width: 4; fill: none; marker-end: url(#arrowhead); }
      .arrow-muted { stroke: #94a3b8; stroke-width: 3; fill: none; marker-end: url(#arrowhead-muted); }
    </style>
    <marker id="arrowhead" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#0f766e"/>
    </marker>
    <marker id="arrowhead-muted" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1500" height="980"/>
  <text class="title" x="80" y="76">Evaluation Pipeline</text>
  <text class="subtitle" x="80" y="116">CareerFit validates matching behavior with small controlled cases and compares baseline methods against the hybrid matcher.</text>

  <rect class="box-input" x="100" y="170" width="430" height="118"/>
  <text class="step" x="130" y="207">STEP 1</text>
  <text class="label" x="130" y="241">Controlled Resume-Job Cases</text>
  <text class="small" x="130" y="270">Short labeled examples for matching behavior</text>

  <rect class="box-input" x="970" y="170" width="430" height="118"/>
  <text class="step" x="1000" y="207">STEP 2</text>
  <text class="label" x="1000" y="241">Expected Labels</text>
  <text class="small" x="1000" y="270">Manual expected matches and ranking outcomes</text>

  <path class="arrow" d="M530 229 H955"/>

  <rect class="box-method" x="150" y="380" width="330" height="130"/>
  <text class="step" x="180" y="417">METHOD A</text>
  <text class="label" x="180" y="451">Keyword Matching</text>
  <text class="small" x="180" y="480">Exact and normalized term overlap</text>

  <rect class="box-method" x="585" y="380" width="330" height="130"/>
  <text class="step" x="615" y="417">METHOD B</text>
  <text class="label" x="615" y="451">TF-IDF Matching</text>
  <text class="small" x="615" y="480">Weighted lexical similarity baseline</text>

  <rect class="box-method" x="1020" y="380" width="330" height="130"/>
  <text class="step" x="1050" y="417">METHOD C</text>
  <text class="label" x="1050" y="451">Hybrid Semantic Matching</text>
  <text class="small" x="1050" y="480">BM25, TF-IDF, concepts, optional embeddings</text>

  <path class="arrow" d="M315 288 V365"/>
  <path class="arrow" d="M750 288 V365"/>
  <path class="arrow" d="M1185 288 V365"/>

  <rect class="box" x="420" y="585" width="660" height="126"/>
  <text class="step" x="450" y="622">STEP 3</text>
  <text class="label" x="450" y="656">Compare Output with Expected Results</text>
  <text class="small" x="450" y="685">Check skill extraction correctness and pair-ranking accuracy</text>

  <path class="arrow" d="M315 510 C390 555, 500 575, 610 585"/>
  <path class="arrow" d="M750 510 V570"/>
  <path class="arrow" d="M1185 510 C1110 555, 1000 575, 890 585"/>

  <rect class="box-metric" x="120" y="790" width="360" height="118"/>
  <text class="step" x="150" y="827">STEP 4A</text>
  <text class="label" x="150" y="861">Classification Metrics</text>
  <text class="small" x="150" y="890">Precision, recall, F1, cases reviewed</text>

  <rect class="box-metric" x="570" y="790" width="360" height="118"/>
  <text class="step" x="600" y="827">STEP 4B</text>
  <text class="label" x="600" y="861">Method Accuracy</text>
  <text class="small" x="600" y="890">Keyword, TF-IDF, hybrid pair-ranking</text>

  <rect class="box-final" x="1020" y="790" width="360" height="118"/>
  <text class="step" x="1050" y="827">STEP 5</text>
  <text class="label" x="1050" y="861">Findings and Limitations</text>
  <text class="small" x="1050" y="890">Strengths, weak cases, dataset limits</text>

  <path class="arrow" d="M620 711 C520 745, 410 765, 320 790"/>
  <path class="arrow" d="M750 711 V775"/>
  <path class="arrow" d="M880 711 C980 745, 1090 765, 1180 790"/>

  <rect class="pill" x="342" y="930" width="160" height="34"/>
  <text class="pill-text" x="370" y="953">precision</text>
  <rect class="pill" x="520" y="930" width="120" height="34"/>
  <text class="pill-text" x="554" y="953">recall</text>
  <rect class="pill" x="658" y="930" width="86" height="34"/>
  <text class="pill-text" x="682" y="953">F1</text>
  <rect class="pill" x="762" y="930" width="126" height="34"/>
  <text class="pill-text" x="792" y="953">accuracy</text>
  <rect class="pill" x="906" y="930" width="238" height="34"/>
  <text class="pill-text" x="932" y="953">average margin</text>
</svg>
