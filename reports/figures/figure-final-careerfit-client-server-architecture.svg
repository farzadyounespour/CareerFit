<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Final CareerFit client-server architecture</title>
  <desc id="desc">Final CareerFit client-server architecture showing the React Vite frontend, REST API connection, Django REST Framework backend modules, ORM database layer, SQLite or PostgreSQL-ready database, and external job and optional coaching services.</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .title { fill: #0f172a; font: 700 42px Arial, Helvetica, sans-serif; }
      .subtitle { fill: #475569; font: 400 21px Arial, Helvetica, sans-serif; }
      .layer { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 20; }
      .frontend { fill: #eff6ff; stroke: #bfdbfe; stroke-width: 2; rx: 18; }
      .backend { fill: #ecfdf5; stroke: #99f6e4; stroke-width: 2; rx: 18; }
      .database { fill: #fffbeb; stroke: #fde68a; stroke-width: 2; rx: 18; }
      .external { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 2; rx: 18; }
      .optional { fill: #f0fdfa; stroke: #5eead4; stroke-width: 2; rx: 18; }
      .label { fill: #0f172a; font: 700 26px Arial, Helvetica, sans-serif; }
      .small { fill: #475569; font: 400 18px Arial, Helvetica, sans-serif; }
      .tiny { fill: #64748b; font: 700 15px Arial, Helvetica, sans-serif; letter-spacing: .5px; }
      .module { fill: #ffffff; stroke: #dbeafe; stroke-width: 1.5; rx: 12; }
      .module-text { fill: #334155; font: 700 16px Arial, Helvetica, sans-serif; }
      .provider { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1.5; rx: 12; }
      .provider-text { fill: #334155; font: 700 16px Arial, Helvetica, sans-serif; }
      .arrow { stroke: #0f766e; stroke-width: 4; fill: none; marker-end: url(#arrowhead); }
      .arrow-muted { stroke: #94a3b8; stroke-width: 3; fill: none; marker-end: url(#arrowhead-muted); }
      .caption { fill: #0f766e; font: 700 18px Arial, Helvetica, sans-serif; }
    </style>
    <marker id="arrowhead" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#0f766e"/>
    </marker>
    <marker id="arrowhead-muted" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1600" height="1000"/>
  <text class="title" x="80" y="76">Final CareerFit Client-Server Architecture</text>
  <text class="subtitle" x="80" y="116">CareerFit uses a React/Vite client, Django REST Framework API, Django ORM persistence, provider integrations, and optional AI coaching.</text>

  <rect class="layer" x="70" y="160" width="1460" height="180"/>
  <text class="tiny" x="110" y="198">CLIENT LAYER</text>
  <rect class="frontend" x="110" y="220" width="520" height="82"/>
  <text class="label" x="140" y="255">React / Vite Frontend</text>
  <text class="small" x="140" y="285">Screens for profile, resume, jobs, report, dashboard, tracker</text>
  <rect class="frontend" x="970" y="220" width="520" height="82"/>
  <text class="label" x="1000" y="255">Browser UI</text>
  <text class="small" x="1000" y="285">Authenticated workspace and public landing page</text>
  <path class="arrow-muted" d="M630 261 H955"/>
  <text class="caption" x="724" y="246">Rendered application</text>

  <rect class="layer" x="70" y="390" width="1460" height="290"/>
  <text class="tiny" x="110" y="428">SERVER LAYER</text>
  <rect class="backend" x="110" y="450" width="620" height="180"/>
  <text class="label" x="140" y="486">Django REST Framework Backend</text>
  <text class="small" x="140" y="516">Token auth, serializers, views, services, throttles</text>
  <rect class="module" x="140" y="544" width="112" height="36"/>
  <text class="module-text" x="163" y="568">Accounts</text>
  <rect class="module" x="266" y="544" width="104" height="36"/>
  <text class="module-text" x="291" y="568">Resumes</text>
  <rect class="module" x="384" y="544" width="76" height="36"/>
  <text class="module-text" x="407" y="568">Jobs</text>
  <rect class="module" x="474" y="544" width="106" height="36"/>
  <text class="module-text" x="497" y="568">Matching</text>
  <rect class="module" x="594" y="544" width="92" height="36"/>
  <text class="module-text" x="615" y="568">Reports</text>
  <rect class="module" x="140" y="592" width="98" height="36"/>
  <text class="module-text" x="164" y="616">Tracker</text>
  <rect class="module" x="252" y="592" width="178" height="36"/>
  <text class="module-text" x="275" y="616">Optional Coaching</text>

  <rect class="external" x="845" y="450" width="645" height="180"/>
  <text class="label" x="875" y="486">External Services</text>
  <text class="small" x="875" y="516">Job search providers and optional AI/local model calls</text>
  <rect class="provider" x="875" y="544" width="92" height="36"/>
  <text class="provider-text" x="897" y="568">Adzuna</text>
  <rect class="provider" x="981" y="544" width="106" height="36"/>
  <text class="provider-text" x="1002" y="568">Remotive</text>
  <rect class="provider" x="1101" y="544" width="110" height="36"/>
  <text class="provider-text" x="1121" y="568">Arbeitnow</text>
  <rect class="provider" x="1225" y="544" width="84" height="36"/>
  <text class="provider-text" x="1247" y="568">Jooble</text>
  <rect class="provider" x="1323" y="544" width="126" height="36"/>
  <text class="provider-text" x="1345" y="568">Sample Jobs</text>
  <rect class="provider" x="875" y="592" width="154" height="36"/>
  <text class="provider-text" x="899" y="616">Ollama Optional</text>
  <rect class="provider" x="1043" y="592" width="156" height="36"/>
  <text class="provider-text" x="1069" y="616">OpenAI Optional</text>

  <path class="arrow" d="M800 340 V375"/>
  <text class="caption" x="833" y="370">REST API</text>
  <path class="arrow" d="M730 540 H830"/>
  <text class="caption" x="748" y="522">Provider calls</text>

  <rect class="layer" x="70" y="730" width="1460" height="180"/>
  <text class="tiny" x="110" y="768">PERSISTENCE LAYER</text>
  <rect class="backend" x="110" y="790" width="520" height="82"/>
  <text class="label" x="140" y="825">Django ORM</text>
  <text class="small" x="140" y="855">Models, migrations, saved reports, saved jobs, resumes</text>
  <rect class="database" x="970" y="790" width="520" height="82"/>
  <text class="label" x="1000" y="825">SQLite / PostgreSQL-Ready Database</text>
  <text class="small" x="1000" y="855">SQLite local default, PostgreSQL through DATABASE_URL</text>
  <path class="arrow" d="M420 680 V775"/>
  <text class="caption" x="450" y="735">ORM</text>
  <path class="arrow" d="M630 831 H955"/>

  <text class="caption" x="515" y="955">Main flow: React/Vite client sends REST requests to Django; backend persists data and calls providers.</text>
</svg>
