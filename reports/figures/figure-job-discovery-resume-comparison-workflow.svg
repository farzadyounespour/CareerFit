<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980" role="img" aria-labelledby="title desc">
  <title id="title">Job discovery and direct resume-job comparison workflow</title>
  <desc id="desc">CareerFit user workflow from entering a job search through provider search, selecting a job, previewing the resume comparison, generating a readiness report, and saving the job to the tracker.</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .title { fill: #0f172a; font: 700 42px Arial, Helvetica, sans-serif; }
      .subtitle { fill: #475569; font: 400 21px Arial, Helvetica, sans-serif; }
      .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 18; }
      .box-user { fill: #eff6ff; stroke: #bfdbfe; stroke-width: 2; rx: 18; }
      .box-system { fill: #ecfdf5; stroke: #99f6e4; stroke-width: 2; rx: 18; }
      .box-output { fill: #fffbeb; stroke: #fde68a; stroke-width: 2; rx: 18; }
      .step { fill: #64748b; font: 700 15px Arial, Helvetica, sans-serif; letter-spacing: .5px; }
      .label { fill: #0f172a; font: 700 25px Arial, Helvetica, sans-serif; }
      .small { fill: #475569; font: 400 18px Arial, Helvetica, sans-serif; }
      .pill { fill: #f1f5f9; stroke: #e2e8f0; stroke-width: 1.5; rx: 12; }
      .pill-text { fill: #334155; font: 700 15px Arial, Helvetica, sans-serif; }
      .arrow { stroke: #0f766e; stroke-width: 4; fill: none; marker-end: url(#arrowhead); }
      .note { fill: #0f766e; font: 700 18px Arial, Helvetica, sans-serif; }
    </style>
    <marker id="arrowhead" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#0f766e"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1500" height="980"/>
  <text class="title" x="80" y="76">Job Discovery and Direct Resume-Job Comparison Workflow</text>
  <text class="subtitle" x="80" y="116">CareerFit connects job search, selected-job preview, readiness reporting, and application tracking in one workflow.</text>

  <rect class="box-user" x="115" y="170" width="410" height="112"/>
  <text class="step" x="145" y="207">USER STEP 1</text>
  <text class="label" x="145" y="241">Enter Job Search</text>
  <text class="small" x="145" y="269">Job title, location, country, filters</text>

  <rect class="box-system" x="975" y="170" width="410" height="112"/>
  <text class="step" x="1005" y="207">SYSTEM STEP 2</text>
  <text class="label" x="1005" y="241">Search Providers</text>
  <text class="small" x="1005" y="269">Live providers or sample fallback</text>

  <path class="arrow" d="M525 226 H960"/>

  <rect class="box-output" x="545" y="330" width="410" height="112"/>
  <text class="step" x="575" y="367">OUTPUT STEP 3</text>
  <text class="label" x="575" y="401">Review Job Results</text>
  <text class="small" x="575" y="429">Provider source, company, location, excerpt</text>

  <path class="arrow" d="M1180 282 C1180 350, 1020 386, 970 386"/>

  <rect class="box-user" x="115" y="490" width="410" height="112"/>
  <text class="step" x="145" y="527">USER STEP 4</text>
  <text class="label" x="145" y="561">Select One Job</text>
  <text class="small" x="145" y="589">Chosen posting becomes the comparison target</text>

  <path class="arrow" d="M545 386 C420 398, 320 440, 320 475"/>

  <rect class="box-system" x="545" y="490" width="410" height="112"/>
  <text class="step" x="575" y="527">SYSTEM STEP 5</text>
  <text class="label" x="575" y="561">Load Job Description</text>
  <text class="small" x="575" y="589">Uses selected job text or imported full posting</text>

  <path class="arrow" d="M525 546 H530"/>

  <rect class="box-system" x="975" y="490" width="410" height="112"/>
  <text class="step" x="1005" y="527">SYSTEM STEP 6</text>
  <text class="label" x="1005" y="561">Compare Resume</text>
  <text class="small" x="1005" y="589">Resume evidence is scored against this job</text>

  <path class="arrow" d="M955 546 H960"/>

  <rect class="box-output" x="975" y="650" width="410" height="112"/>
  <text class="step" x="1005" y="687">OUTPUT STEP 7</text>
  <text class="label" x="1005" y="721">Show Quick Preview</text>
  <text class="small" x="1005" y="749">Match score, readiness score, gaps</text>

  <path class="arrow" d="M1180 602 V635"/>

  <rect class="box-output" x="545" y="650" width="410" height="112"/>
  <text class="step" x="575" y="687">OUTPUT STEP 8</text>
  <text class="label" x="575" y="721">Generate Full Report</text>
  <text class="small" x="575" y="749">Evidence, ATS checks, recommendations</text>

  <path class="arrow" d="M975 706 H970"/>

  <rect class="box-system" x="115" y="650" width="410" height="112"/>
  <text class="step" x="145" y="687">SYSTEM STEP 9</text>
  <text class="label" x="145" y="721">Save to Tracker</text>
  <text class="small" x="145" y="749">Selected job becomes a tracked application</text>

  <path class="arrow" d="M545 706 H530"/>

  <rect class="pill" x="210" y="828" width="210" height="40"/>
  <text class="pill-text" x="242" y="853">Job discovery</text>
  <rect class="pill" x="450" y="828" width="245" height="40"/>
  <text class="pill-text" x="482" y="853">Selected-job preview</text>
  <rect class="pill" x="725" y="828" width="230" height="40"/>
  <text class="pill-text" x="758" y="853">Readiness report</text>
  <rect class="pill" x="985" y="828" width="230" height="40"/>
  <text class="pill-text" x="1024" y="853">Application tracker</text>

  <text class="note" x="382" y="920">The workflow keeps the selected job connected to the comparison, report, and tracker.</text>
</svg>
