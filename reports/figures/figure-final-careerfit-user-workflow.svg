<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="title desc">
  <title id="title">Final CareerFit User Workflow</title>
  <desc id="desc">Final CareerFit user workflow from sign-in and profile completion through resume upload, job search or import, selected job comparison, readiness report generation, resume improvement, and application tracking.</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .title { fill: #0f172a; font: 700 44px Arial, Helvetica, sans-serif; }
      .subtitle { fill: #475569; font: 400 21px Arial, Helvetica, sans-serif; }
      .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 18; }
      .profile { fill: #eff6ff; stroke: #bfdbfe; stroke-width: 2; rx: 18; }
      .resume { fill: #f0fdfa; stroke: #99f6e4; stroke-width: 2; rx: 18; }
      .job { fill: #ecfdf5; stroke: #5eead4; stroke-width: 3; rx: 18; }
      .report { fill: #fffbeb; stroke: #fde68a; stroke-width: 2; rx: 18; }
      .tracker { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 2; rx: 18; }
      .step { fill: #64748b; font: 700 15px Arial, Helvetica, sans-serif; letter-spacing: .5px; }
      .label { fill: #0f172a; font: 700 24px Arial, Helvetica, sans-serif; }
      .small { fill: #475569; font: 400 18px Arial, Helvetica, sans-serif; }
      .emphasis { fill: #0f766e; font: 700 18px Arial, Helvetica, sans-serif; }
      .pill { fill: #ffffff; stroke: #d1fae5; stroke-width: 1.5; rx: 12; }
      .pill-text { fill: #0f766e; font: 700 15px Arial, Helvetica, sans-serif; }
      .arrow { stroke: #0f766e; stroke-width: 4; fill: none; marker-end: url(#arrowhead); }
      .arrow-muted { stroke: #94a3b8; stroke-width: 3; fill: none; marker-end: url(#arrowhead-muted); }
    </style>
    <marker id="arrowhead" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#0f766e"/>
    </marker>
    <marker id="arrowhead-muted" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1600" height="1050"/>
  <text class="title" x="80" y="78">Final CareerFit User Workflow</text>
  <text class="subtitle" x="80" y="118">The implemented workflow connects account setup, resume preparation, job discovery, direct resume fit preview, reporting, and tracking.</text>

  <rect class="profile" x="100" y="175" width="380" height="118"/>
  <text class="step" x="130" y="212">STEP 1</text>
  <text class="label" x="130" y="246">Sign In or Create Account</text>
  <text class="small" x="130" y="275">Authenticated workspace for saved data</text>

  <rect class="profile" x="610" y="175" width="380" height="118"/>
  <text class="step" x="640" y="212">STEP 2</text>
  <text class="label" x="640" y="246">Complete Candidate Profile</text>
  <text class="small" x="640" y="275">Name, contact details, target role, preferences</text>

  <rect class="resume" x="1120" y="175" width="380" height="118"/>
  <text class="step" x="1150" y="212">STEP 3</text>
  <text class="label" x="1150" y="246">Upload or Paste Resume</text>
  <text class="small" x="1150" y="275">PDF, DOCX, TXT, or pasted resume text</text>

  <path class="arrow" d="M480 234 H595"/>
  <path class="arrow" d="M990 234 H1105"/>

  <rect class="resume" x="610" y="365" width="380" height="118"/>
  <text class="step" x="640" y="402">STEP 4</text>
  <text class="label" x="640" y="436">Review and Edit Resume Text</text>
  <text class="small" x="640" y="465">Confirm extracted text before matching</text>

  <path class="arrow" d="M1310 293 C1310 350, 1060 424, 1005 424"/>

  <rect class="job" x="100" y="555" width="420" height="142"/>
  <text class="step" x="130" y="592">STEP 5</text>
  <text class="label" x="130" y="626">Search or Add Job Posting</text>
  <text class="small" x="130" y="655">Provider search, URL import, or pasted job text</text>
  <rect class="pill" x="130" y="673" width="126" height="32"/>
  <text class="pill-text" x="153" y="695">Job search</text>
  <rect class="pill" x="270" y="673" width="176" height="32"/>
  <text class="pill-text" x="294" y="695">Direct job input</text>

  <rect class="job" x="590" y="555" width="420" height="142"/>
  <text class="step" x="620" y="592">STEP 6</text>
  <text class="label" x="620" y="626">Select a Job Posting</text>
  <text class="small" x="620" y="655">Chosen posting becomes the matching target</text>
  <text class="emphasis" x="620" y="687">Selected job description is loaded for scoring</text>

  <rect class="job" x="1080" y="555" width="420" height="142"/>
  <text class="step" x="1110" y="592">STEP 7</text>
  <text class="label" x="1110" y="626">Run Quick Resume Comparison</text>
  <text class="small" x="1110" y="655">Immediate fit preview for the selected job</text>
  <text class="emphasis" x="1110" y="687">Shows match score, readiness, and gaps</text>

  <path class="arrow" d="M610 424 C430 450, 320 500, 310 540"/>
  <path class="arrow" d="M520 626 H575"/>
  <path class="arrow" d="M1010 626 H1065"/>

  <rect class="report" x="590" y="785" width="420" height="118"/>
  <text class="step" x="620" y="822">STEP 8</text>
  <text class="label" x="620" y="856">Generate Readiness Report</text>
  <text class="small" x="620" y="885">Requirement evidence, ATS checks, recommendations</text>

  <rect class="tracker" x="1080" y="785" width="420" height="118"/>
  <text class="step" x="1110" y="822">STEP 9B</text>
  <text class="label" x="1110" y="856">Save Job to Tracker</text>
  <text class="small" x="1110" y="885">Application stage, notes, packets, follow-ups</text>

  <rect class="tracker" x="100" y="785" width="420" height="118"/>
  <text class="step" x="130" y="822">STEP 9A</text>
  <text class="label" x="130" y="856">Improve Resume</text>
  <text class="small" x="130" y="885">Accept, edit, or dismiss suggested fixes</text>

  <path class="arrow" d="M1290 697 C1290 750, 1030 800, 1010 820"/>
  <path class="arrow" d="M800 697 V770"/>
  <path class="arrow-muted" d="M590 844 H535"/>
  <path class="arrow-muted" d="M1010 844 H1065"/>

  <text class="emphasis" x="475" y="975">Main value: users search or import a real job, select it, and immediately compare their resume against that exact posting.</text>
</svg>
